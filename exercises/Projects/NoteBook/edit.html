<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Edit Note</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 30px;
        }

        textarea,
        input {
            width: 100%;
            padding: 8px;
            margin-top: 6px;
        }

        button {
            margin-top: 12px;
            padding: 8px 15px;
            cursor: pointer;
        }

        .meta {
            color: #666;
            font-size: 0.9em;
        }
    </style>
</head>

<body>
    <h1>Edit Note</h1>
    <form method="POST" action="/edit">
        <input type="hidden" name="index" value="{{.Index}}">
        <label>Title:</label><br>
        <input type="text" name="title" value="{{.Note.Title}}"><br><br>

        <label>Body:</label><br>
        <textarea name="body" rows="6">{{.Note.Body}}</textarea><br><br>

        <p class="meta">Created: {{.Note.CreatedAt.Format "2006-01-02 15:04:05"}}</p>
        <p class="meta">Last Updated: {{.Note.UpdatedAt.Format "2006-01-02 15:04:05"}}</p>

        <button type="submit">Update</button>
    </form>
    <br>
    <a href="/"><button>Back to List</button></a>
</body>

</html>

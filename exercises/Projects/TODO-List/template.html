<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Todo List</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
        }

        button {
            margin-left: 5px;
        }
    </style>
</head>

<body>
    <h1>My Todo List</h1>
    <ul>
        {{range $index, $todo := .}}
        <li>
            <strong>{{.Title}}</strong>: {{.Content}}
            <form method="GET" action="/edit" style="display:inline;">
                <input type="hidden" name="index" value="{{$index}}">
                <button type="submit">Edit</button>
            </form>
            <form method="GET" action="/delete" style="display:inline;">
                <input type="hidden" name="index" value="{{$index}}">
                <button type="submit">Delete</button>
            </form>
        </li>
        {{else}}
        <li>No todos yet.</li>
        {{end}}
    </ul>
    <br>
    <a href="/create"><button>Add New Todo</button></a>
</body>

</html>

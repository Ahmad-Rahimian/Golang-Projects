<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Todo List</title>
</head>

<body>
    <h1>Todo List</h1>

    <form method="POST" action="/">
        <input type="text" name="title" placeholder="عنوان تسک">
        <br>
        <textarea name="details" placeholder="جزئیات تسک"></textarea>
        <br>
        <button type="submit">افزودن تسک</button>
    </form>

    <h2>تسک‌های شما:</h2>
    <ul>
        {{range .}}
        <li><strong>{{.ID}}. {{.Title}}</strong> - {{.Details}}</li>
        {{else}}
        <li>تسکی وجود ندارد</li>
        {{end}}
    </ul>
</body>

</html>
